name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    # Explicit write here (not just the workflow-level grant): with
    # `releaseDraft: false`, tauri-action publishes the release and marks it
    # `latest` in one shot. That publish path is denied with "Resource not
    # accessible by integration" if the effective token is read-only — which
    # is what broke the first v0.1.9 attempt. Pin it per-job so the release
    # can be created AND published regardless of the repo's default baseline.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Linux build (ubuntu-22.04) — its glibc is forward-compatible
          # to Ubuntu 22.04 AND 24.04 users (the AppImage / .deb / .rpm
          # produced here install cleanly on both).
          - os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: ''
          # One Windows build (Server 2022) — covers Windows 10 (1809+) and 11.
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            patchelf \
            file \
            rpm \
            osslsigncode

      - name: Install npm deps
        run: npm ci

      # Release notes come from CHANGELOG.md (same source as the in-app
      # "What's new" dialog). Falls back to a pointer if the section is missing.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v v="$V" '
            $0 ~ "^## v"v"([^0-9]|$)" {p=1; next}
            /^## v/ && p {exit}
            p {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="See CHANGELOG.md for details."; fi
          {
            echo "body<<NERVA_EOF"
            echo "$NOTES"
            echo "NERVA_EOF"
          } >> "$GITHUB_OUTPUT"

      # ---------- Windows signing prep (self-signed PFX from secret) ----------
      - name: Decode Windows signing cert
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $pfxBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", $pfxBytes)
          echo "PFX_PATH=$env:RUNNER_TEMP\codesign.pfx" >> $env:GITHUB_ENV

      # ---------- Build + sign + bundle ----------
      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows-only signing env (read by tauri.conf.json windows block via signtool):
          TAURI_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          # NSIS / signtool need these only on Windows runner:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nerva ${{ github.ref_name }}'
          releaseBody: |
            ## Nerva by Bytical ${{ github.ref_name }}

            ${{ steps.notes.outputs.body }}

            ### Downloads
            - **Linux (Ubuntu 22.04 / 24.04, Fedora, etc.)** — `.AppImage` (portable) or `.deb` / `.rpm` · also `yay -S nerva-desktop-bin`, `snap install nerva`
            - **Windows 10 / 11** — `.msi` (installer) or `-setup.exe` (NSIS) · also `winget install Bytical.Nerva`
            - Direct links that always point at the latest build: https://nerva.bytical.ai/#download

            ### Verifying the Windows build
            Installers are signed with the Bytical self-signed certificate.
            Windows SmartScreen will show "Unrecognized app" on first install —
            click **More info → Run anyway**. To remove the warning forever,
            import [`bytical-codesign.crt`](https://nerva.bytical.ai/cert) into
            Trusted Root Certification Authorities.

            ---
            If Nerva helps you focus, a ⭐ on this repo and a rating (Settings → Feedback in the app, or https://nerva.bytical.ai/#feedback) go a long way.
          # Publish the release immediately (not as a draft). A draft release
          # is invisible to the updater: GitHub's `/releases/latest/` endpoint
          # only resolves to the latest *published* release, so leaving builds
          # as drafts means `latest.json` never updates and the in-app updater
          # always reports "you're on the latest version". Auto-publishing keeps
          # the updater manifest live the moment the build finishes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri-args }}

      # Linux-side osslsigncode for AppImage (optional, GPG-equivalent flow comes later)
      # Windows signing is handled by tauri-action via TAURI_WINDOWS_CERTIFICATE_THUMBPRINT.

      - name: Upload artifacts (for non-release runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nerva-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14

  # NOTE: tauri-action (used in the build job above) already publishes a
  # complete `latest.json` updater manifest to the release with signatures
  # for every platform variant (linux-x86_64, linux-x86_64-deb,
  # linux-x86_64-rpm, linux-x86_64-appimage, windows-x86_64,
  # windows-x86_64-msi, windows-x86_64-nsis). No additional job needed.

  # After all builds finish, submit a winget manifest PR (Windows only)
  winget-publish:
    name: Publish to winget
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease
    steps:
      - name: Submit winget package update
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Bytical.Nerva
          installers-regex: '(-setup\.exe|\.msi)$'
          token: ${{ secrets.WINGET_TOKEN }}
        continue-on-error: true   # don't block the release if PR submission fails

  # Publish to the AUR (nerva-desktop-bin). Repacks the .deb tauri-action just
  # uploaded: bump pkgver, recompute sha256, regenerate .SRCINFO, push to
  # aur.archlinux.org over SSH (AUR_SSH_PRIVATE_KEY secret = ~/.ssh/aur of the
  # `piyushptiwari` AUR account). Also commits the refreshed PKGBUILD/.SRCINFO
  # back to this repo so packaging/aur stays in sync with what's live.
  aur-publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wait for the .deb asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if gh release view "v$V" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "Nerva_${V}_amd64.deb"; then exit 0; fi
            sleep 20
          done
          echo "::error::Nerva_${V}_amd64.deb never appeared on release v$V"; exit 1
      - name: Bump PKGBUILD + sha256
        id: bump
        run: |
          V="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/Nerva_${V}_amd64.deb"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          cd packaging/aur/nerva-desktop-bin
          sed -i -E "s/^pkgver=.*/pkgver=${V}/; s/^pkgrel=.*/pkgrel=1/; s/^sha256sums=\(.*\)/sha256sums=('${SHA}')/" PKGBUILD
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          grep -E "^(pkgver|pkgrel|sha256sums)" PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: nerva-desktop-bin
          pkgbuild: ./packaging/aur/nerva-desktop-bin/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.bump.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          updpkgsums: false
          test: false
        continue-on-error: true
      - name: Sync packaging/aur + flatpak back to main
        run: |
          V="${{ steps.bump.outputs.version }}"; SHA="${{ steps.bump.outputs.sha }}"
          # .SRCINFO mirrors PKGBUILD (generated by makepkg in the action; keep ours in step).
          cd packaging/aur/nerva-desktop-bin
          sed -i -E "s/^(\s*pkgver = ).*/\1${V}/; s/^(\s*pkgrel = ).*/\11/; s#^(\s*source = ).*#\1nerva-${V}.deb::https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/Nerva_${V}_amd64.deb#; s/^(\s*sha256sums = ).*/\1${SHA}/" .SRCINFO
          cd "$GITHUB_WORKSPACE"
          sed -i -E "s#(releases/download/v)[0-9.]+/Nerva_[0-9.]+_amd64\.deb#\1${V}/Nerva_${V}_amd64.deb#" flatpak/ai.bytical.nerva.yaml
          # Only the .deb sha line (the one right after the .deb url) is replaced.
          awk -v sha="$SHA" '/Nerva_.*_amd64\.deb/{f=1} f && /sha256:/{sub(/sha256: .*/, "sha256: " sha); f=0} {print}' flatpak/ai.bytical.nerva.yaml > /tmp/fp && mv /tmp/fp flatpak/ai.bytical.nerva.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/aur flatpak/ai.bytical.nerva.yaml
          git diff --cached --quiet || { git commit -m "packaging: AUR + flatpak → v${V} (sha256 refresh) [skip ci]"; git push origin main; }

  # Build and publish the Snap to the Snap Store stable channel.
  # The snap repacks the .deb that tauri-action just uploaded to the
  # GitHub release, so we download it instead of rebuilding from
  # source (a fresh Tauri 2 build inside a snap base takes ~25 min).
  snap-publish:
    name: Build and publish Snap
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease
    permissions:
      # `contents: write` (not read): the asset-settle poll below queries the
      # releases REST API, and the promote-to-published fallback edits the
      # release. A read-only token cannot see draft releases at all, which is
      # what silently broke Snap publishing on v0.1.8.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync snap version with git tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
          grep '^version:' snap/snapcraft.yaml

      - name: Wait for release assets to settle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # tauri-action publishes the release directly (releaseDraft: false)
          # and uploads every asset over several minutes. Poll the REST API
          # until the .deb is present (up to 20 min). The API also includes
          # draft releases when the token has `contents: write`, so this stays
          # correct even if a release is ever cut as a draft again.
          for i in $(seq 1 40); do
            if gh api "repos/${{ github.repository }}/releases" \
                 --jq ".[] | select(.tag_name==\"$TAG\") | .assets[].name" \
                 2>/dev/null | grep -q '_amd64\.deb$'; then
              echo "deb is up"; exit 0
            fi
            echo "waiting for deb... ($i/40)"; sleep 30
          done
          echo "::error::deb asset never appeared on $TAG"; exit 1

      - name: Ensure release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Normally a no-op now that the build publishes directly, but keep it
          # as a safety net: if anything ever leaves the release as a draft,
          # downstream consumers (and the in-app updater's /releases/latest
          # endpoint) need it flipped to a real, latest release.
          gh release edit "$TAG" --draft=false --latest || true

      - name: Download .deb from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p src-tauri/target/release/bundle/deb
          gh release download "$TAG" -p '*_amd64.deb' \
            -D src-tauri/target/release/bundle/deb/
          ls -la src-tauri/target/release/bundle/deb/

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Publish to stable
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
        continue-on-error: true   # don't block other distribution channels if Snap Store rejects
